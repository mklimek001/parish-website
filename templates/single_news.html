{% extends 'base.html' %}

{% block head %}
<title>{{post.title}}</title>
{% endblock %}

{% block body %}    
    <div id="main">
        <div class="content-container">
            <div class="news-box">
                <div id="photo-field">
                    <img class="main-photo" src="{{post.main_photo}}" alt="NewsImage"></img>
                </div>
                <h2 class="info-title" id="title-field"> {{post.title}} </h2>
                <div class="info-text" >
                    <p class="content-field">{{ post.content_html|safe }}</p>
                </div>

                {% for photo in photos %}
                <div class = "gallery-photo-box">
                    <img class="gallery-photo" src="{{photo.photo_addres}}" alt="NewsImage"></img>
                    <div class="gallery-photo-desc">{{photo.description}}</div>
                </div>
                {% endfor %}
                
            </div>
        </div>

        <div class="latest-news-box">
            <div class="container">
                <div class="row justify-content-center">
                    {% for post in posts %}
                    <div class="col-xl-3 col-md-5 col-sm-12 widget-box" >
                        <a href="/aktualnosci/{{post.id}}" class="non-decorated-link">
                            <div class="widget-inner-container inner-container-on-black"> 
                                <img alt="NewsImage" src="{{post.main_photo}}">
                                <h2>{{post.title}}</h2>
                            </div>
                        </a>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close-gallery">&times;</span>
        <span class="prev">&#10094;</span>
        <img id="lightbox-img" src="" alt="">
        <span class="next">&#10095;</span>
    </div>

    <script>
    const photos = document.querySelectorAll(".gallery-photo");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = lightbox.querySelector(".close-gallery");
    const prevBtn = lightbox.querySelector(".prev");
    const nextBtn = lightbox.querySelector(".next");

    let currentIndex = 0;

    function showImage(index) {
        if (index < 0) index = photos.length - 1;
        if (index >= photos.length) index = 0;
        currentIndex = index;
        lightboxImg.src = photos[currentIndex].src;
        lightbox.style.display = "flex";
    }

    photos.forEach((photo, index) => {
        photo.addEventListener("click", () => {
        showImage(index);
        });
    });

    closeBtn.addEventListener("click", () => {
        lightbox.style.display = "none";
    });

    prevBtn.addEventListener("click", () => {
        showImage(currentIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
        showImage(currentIndex + 1);
    });

    document.addEventListener("keydown", (e) => {
        if (lightbox.style.display === "flex") {
        if (e.key === "ArrowLeft") showImage(currentIndex - 1);
        if (e.key === "ArrowRight") showImage(currentIndex + 1);
        if (e.key === "Escape") lightbox.style.display = "none";
        }
    });
    </script>

    {% endblock %}

</body>
</html>
