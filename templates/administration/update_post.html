{% extends 'base.html' %}

{% block head %}
<title>Aktualizacja wpisu</title>
<script src="https://cdn.jsdelivr.net/npm/marked@3.0.7/marked.min.js"></script>
{% endblock %}

{% block body %}
<div class="main">
    <div class="container">
        <div class="management-bar">
            <h1>Aktualizacja wpisu</h1>
            <form action="/update-post/{{post.id}}" method="POST">
                <p>Tytuł:</p>
                <input type="text" name="title" id="new-post-title" maxlength="100"  value="{{post.title}}" required> <br>

                <p>Zdjęcie główne:</p>
                <button type="button" id="quick-new-post-photo" class="management-button" data-bs-toggle="modal" data-bs-target="#photoModal">
                    Wybierz zdjęcie
                </button>
                <a class="non-decorated-link management-button" href="{{url_for('photos')}}" target="_blank">
                    Wszystkie zdjęcia
                </a> 
                <input type="text" name="photo" id="new-post-photo" maxlength="200"  value="{{post.main_photo}}" required>
                <br>          

                <p>Treść:</p>
                <textarea name="content" id="new-post-content" rows="16" maxlength="3600" required >{{post.content}}</textarea> <br>
                <input type="submit" value="Zapisz" class="management-button submit-post-button">
                <button type="button" id="preview-button" class="management-button">Podgląd</button>
                <a class="non-decorated-link management-button back-button"
                href="{{url_for('management')}}"
                onclick="return confirm('Czy na pewno chcesz opuścić stronę? Niezapisane zmiany zostaną utracone.');">
                    Powrót
                </a>
            </form>
        </div>
    </div>
</div>

<div class="modal" id="photoModal" tabindex="-1" aria-labelledby="photoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="photoModalLabel">Wybierz zdjęcie</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
      </div>
      <div class="modal-body">
        <div class="row justify-content-center" id="photos-row">
            {% for photo_addr in photos %}
            <div class="col-xl-3 col-md-5 col-sm-12 widget-box mb-3">
                <img class="img-fluid selectable-photo" 
                     src="{{ url_for('static', filename=photo_addr)}}" 
                     data-photo="{{ url_for('static', filename=photo_addr)}}"
                     alt="NewsImage">
            </div>
            {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Photo selection script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@3.0.7/marked.min.js"></script>
<script src="{{ url_for('static', filename='javascript/preview.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const photoInput = document.getElementById("new-post-photo");
    const photos = document.querySelectorAll(".selectable-photo");

    photos.forEach(photo => {
        photo.addEventListener("click", () => {
            const addr = photo.getAttribute("data-photo");
            photoInput.value = addr;

            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('photoModal'));
            modal.hide();
        });
    });
});
</script>
{% endblock %}
